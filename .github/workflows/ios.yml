name: iOS

# macOS minutes are expensive on private repositories, so this runs only
# when asked: manually, or for commits whose message contains [ios].
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check platform folders
        run: |
          if [ ! -f ios/Runner/Info.plist ]; then
            echo "Platform folders are created by the Android workflow; run it first."
            exit 1
          fi

      - run: flutter pub get

      - name: Compile without signing
        if: env.HAS_ASC != 'true'
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Build, sign and upload to TestFlight
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${AUTH[@]}"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect; it appears in TestFlight after processing."
